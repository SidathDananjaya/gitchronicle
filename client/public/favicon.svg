<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  fill="none"
>
  <defs>
    <linearGradient id="gradient" x1="8" y1="8" x2="56" y2="56">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark favicon background -->
  <rect
    width="64"
    height="64"
    rx="16"
    fill="#020812"
  />

  <!-- Outer chronicle/orbit -->
  <circle
    cx="32"
    cy="32"
    r="22"
    stroke="url(#gradient)"
    stroke-width="2"
    opacity="0.25"
  />

  <!-- Git branch -->
  <path
    d="M22 18V39C22 43 25 46 29 46H35"
    stroke="url(#gradient)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <path
    d="M22 29C22 25 25 22 29 22H35"
    stroke="url(#gradient)"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Branch nodes -->
  <circle
    cx="22"
    cy="18"
    r="5"
    fill="#020812"
    stroke="#00D4FF"
    stroke-width="3"
  />

  <circle
    cx="22"
    cy="39"
    r="5"
    fill="#020812"
    stroke="#7C3AED"
    stroke-width="3"
  />

  <circle
    cx="37"
    cy="46"
    r="5"
    fill="#020812"
    stroke="#EC4899"
    stroke-width="3"
  />

  <!-- Timeline spark -->
  <circle
    cx="45"
    cy="18"
    r="2"
    fill="#00D4FF"
  />
</svg>
